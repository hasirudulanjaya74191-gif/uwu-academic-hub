<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Insights | UWU Academic Hub</title>
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --uwu-green: #2e7d32; --bg: #f4f7f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: var(--uwu-green); font-size: 1.2rem; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        #loading { text-align: center; font-size: 1.5rem; margin-top: 50px; }
    </style>
</head>
<body>

<div id="loading">Loading Data from Excel...</div>

<div class="container" id="dashboard" style="display:none;">
    <div class="header">
        <h1>UWU Academic Hub - Live Statistics</h1>
        <p>Data automatically synced from your uploaded CSV file.</p>
    </div>

    <div class="grid">
        <!-- Chart 1 -->
        <div class="card">
            <h2>A/L Stream Distribution</h2>
            <canvas id="streamChart"></canvas>
        </div>

        <!-- Chart 2 -->
        <div class="card">
            <h2>University Placements</h2>
            <canvas id="uniChart"></canvas>
        </div>

        <!-- Chart 3 -->
        <div class="card">
            <h2>A/L Result 1 (Grade Mix)</h2>
            <canvas id="resultChart"></canvas>
        </div>

        <!-- Chart 4 -->
        <div class="card">
            <h2>Satisfaction Levels</h2>
            <canvas id="satisfactionChart"></canvas>
        </div>
    </div>
</div>

<script>
    // URL to your CSV file on GitHub
    const csvUrl = 'data.csv'; 

    // Function to parse the CSV and Create Charts
    Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            processData(results.data);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }
    });

    function processData(data) {
        // Create counters for our categories
        const streams = {};
        const unis = {};
        const results = {};
        const satisfaction = {};

        data.forEach(row => {
            // Count A/L Streams (e.g., Technology Stream)
            if(row.al_stream) streams[row.al_stream] = (streams[row.al_stream] || 0) + 1;
            
            // Count Universities
            if(row.university) unis[row.university] = (unis[row.university] || 0) + 1;

            // Count A/L Results (Column: al_result_1)
            if(row.al_result_1) results[row.al_result_1] = (results[row.al_result_1] || 0) + 1;

            // Count Satisfaction
            if(row.satisfaction_level) satisfaction[row.satisfaction_level] = (satisfaction[row.satisfaction_level] || 0) + 1;
        });

        // Helper to create charts
        makeChart('streamChart', 'bar', streams, 'Students per Stream', '#2e7d32');
        makeChart('uniChart', 'doughnut', unis, 'Universities', ['#2e7d32', '#1565c0', '#ffc107', '#e91e63', '#9e9e9e']);
        makeChart('resultChart', 'pie', results, 'Result Mix', ['#2e7d32', '#1565c0', '#ffc107', '#f44336']);
        makeChart('satisfactionChart', 'polarArea', satisfaction, 'Satisfaction', ['#4caf50', '#2196f3', '#ff9800', '#f44336']);
    }

    function makeChart(id, type, dataObj, label, colors) {
        new Chart(document.getElementById(id), {
            type: type,
            data: {
                labels: Object.keys(dataObj),
                datasets: [{
                    label: label,
                    data: Object.values(dataObj),
                    backgroundColor: colors
                }]
            },
            options: { responsive: true }
        });
    }
</script>

</body>
</html>
