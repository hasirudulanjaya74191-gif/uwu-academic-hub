<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Insights | UniPath Lanka</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chart-card { background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 py-4 mb-8">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <span class="text-xl font-bold text-slate-800">UniPath <span class="text-blue-600">Lanka</span></span>
            <div class="space-x-6 text-sm font-medium">
                <a href="index.html" class="text-slate-600 hover:text-blue-600">Census Form</a>
                <a href="survey.html" class="text-blue-600 font-semibold">Data Insights</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6">
        <div class="mb-10 text-center md:text-left">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Student Survey Insights</h1>
            <p class="text-slate-500 mt-2">Visualizing trends across A/L streams, university choices, and student satisfaction levels.</p>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Chart 1: A/L Streams Distribution -->
            <div class="chart-card">
                <h3 class="text-lg font-bold text-slate-800 mb-4">A/L Streams Distribution</h3>
                <div class="relative h-72">
                    <canvas id="streamChart"></canvas>
                </div>
            </div>

            <!-- Chart 2: Satisfaction Levels -->
            <div class="chart-card">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Degree Satisfaction Levels</h3>
                <div class="relative h-72">
                    <canvas id="satisfactionChart"></canvas>
                </div>
            </div>

            <!-- Chart 3: Government vs Private Institutions -->
            <div class="chart-card md:col-span-2">
                <h3 class="text-lg font-bold text-slate-800 mb-4">University / Institution Choices</h3>
                <div class="relative h-80">
                    <canvas id="uniChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript for Charts -->
    <script>
        // 1. A/L Streams Chart
        const ctxStream = document.getElementById('streamChart').getContext('2d');
        new Chart(ctxStream, {
            type: 'doughnut',
            data: {
                labels: ['Physical Science', 'Biological Science', 'Commerce', 'Technology', 'Arts'],
                datasets: [{
                    data: [35, 25, 20, 15, 5],
                    backgroundColor: ['#2563eb', '#38bdf8', '#f59e0b', '#10b981', '#6366f1']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // 2. Satisfaction Chart
        const ctxSat = document.getElementById('satisfactionChart').getContext('2d');
        new Chart(ctxSat, {
            type: 'bar',
            data: {
                labels: ['Very Satisfied', 'Satisfied', 'Neutral', 'Dissatisfied'],
                datasets: [{
                    label: 'Number of Students',
                    data: [45, 30, 15, 10],
                    backgroundColor: '#3b82f6'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // 3. University / Institution Chart
        const ctxUni = document.getElementById('uniChart').getContext('2d');
        new Chart(ctxUni, {
            type: 'bar',
            data: {
                labels: ['Colombo', 'Peradeniya', 'Moratuwa', "J'pura", 'SLIIT', 'NSBM', 'IIT'],
                datasets: [{
                    label: 'Students Enrolled',
                    data: [28, 22, 25, 30, 40, 20, 15],
                    backgroundColor: '#6366f1'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    </script>
</body>
</html>
