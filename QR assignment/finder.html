<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degree Finder | UniPath Lanka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .result-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .result-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-slate-800">UniPath <span class="text-blue-600">Lanka</span></span>
            </div>
            <div class="flex gap-6 text-sm font-medium">
                <a href="index.html" class="hover:text-blue-600">Home</a>
                <a href="survey.html" class="hover:text-blue-600">Contribute Data</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid lg:grid-cols-4 gap-8">
            
            <!-- Search Filters Sidebar -->
            <aside class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm sticky top-24">
                    <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                        </svg>
                        Filter Degrees
                    </h2>
                    
                    <form id="finderForm" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Home District</label>
                            <select id="district" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="Colombo">Colombo</option>
                                <option value="Gampaha">Gampaha</option>
                                <option value="Kalutara">Kalutara</option>
                                <option value="Kandy">Kandy</option>
                                <option value="Matale">Matale</option>
                                <option value="Nuwara Eliya">Nuwara Eliya</option>
                                <option value="Galle">Galle</option>
                                <option value="Matara">Matara</option>
                                <option value="Hambantota">Hambantota</option>
                                <option value="Jaffna">Jaffna</option>
                                <option value="Kilinochchi">Kilinochchi</option>
                                <option value="Mannar">Mannar</option>
                                <option value="Vavuniya">Vavuniya</option>
                                <option value="Mullaitivu">Mullaitivu</option>
                                <option value="Batticaloa">Batticaloa</option>
                                <option value="Ampara">Ampara</option>
                                <option value="Trincomalee">Trincomalee</option>
                                <option value="Kurunegala">Kurunegala</option>
                                <option value="Puttalam">Puttalam</option>
                                <option value="Anuradhapura">Anuradhapura</option>
                                <option value="Polonnaruwa">Polonnaruwa</option>
                                <option value="Badulla">Badulla</option>
                                <option value="Moneragala">Moneragala</option>
                                <option value="Ratnapura">Ratnapura</option>
                                <option value="Kegalle">Kegalle</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">A/L Stream</label>
                            <select id="stream" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="Physical Science">Physical Science</option>
                                <option value="Biological Science">Biological Science</option>
                                <option value="Commerce">Commerce</option>
                                <option value="Arts">Arts</option>
                                <option value="Technology">Technology</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Your Z-Score</label>
                            <input type="number" id="zscore" step="0.0001" placeholder="e.g. 1.8540" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <button type="button" onclick="findDegrees()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg shadow-blue-100">
                            Find Eligible Degrees
                        </button>
                    </form>
                </div>
            </aside>

            <!-- Results Section -->
            <section class="lg:col-span-3">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h1 class="text-3xl font-extrabold text-slate-900">Recommended Pathways</h1>
                        <p class="text-slate-500 mt-1">Based on historical cut-off data and current satisfaction trends.</p>
                    </div>
                    <div id="resultCount" class="text-sm font-semibold text-blue-600 bg-blue-50 px-4 py-1 rounded-full">
                        0 matches found
                    </div>
                </div>

                <!-- Cards Grid -->
                <div id="resultsGrid" class="grid md:grid-cols-2 gap-6">
                    <!-- Default State -->
                    <div class="md:col-span-2 py-20 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
                        <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-700">Ready to search?</h3>
                        <p class="text-slate-500">Enter your Z-Score and Stream to see your university options.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Mock Dataset: Real Sri Lankan Degree Trends
        const degreeData = [
            // Physical Science - Government
            { name: "BSc (Hons) in Engineering", uni: "University of Moratuwa", type: "Government", stream: "Physical Science", minZ: 1.85, districts: "All", satisfaction: "98%" },
            { name: "BSc (Hons) in Computer Science", uni: "University of Colombo", type: "Government", stream: "Physical Science", minZ: 1.72, districts: "All", satisfaction: "95%" },
            { name: "BSc (Hons) in Physical Science", uni: "University of Sri Jayewardenepura", type: "Government", stream: "Physical Science", minZ: 1.45, districts: "All", satisfaction: "88%" },
            { name: "BSc (Hons) in Applied Physics", uni: "University of Kelaniya", type: "Government", stream: "Physical Science", minZ: 1.35, districts: "All", satisfaction: "84%" },
            
            // Biological Science - Government
            { name: "Bachelor of Medicine (MBBS)", uni: "University of Colombo", type: "Government", stream: "Biological Science", minZ: 1.95, districts: "All", satisfaction: "99%" },
            { name: "BSc (Hons) in Molecular Biology", uni: "University of Peradeniya", type: "Government", stream: "Biological Science", minZ: 1.65, districts: "All", satisfaction: "92%" },
            { name: "BSc (Hons) in Nursing", uni: "University of Ruhuna", type: "Government", stream: "Biological Science", minZ: 1.25, districts: "All", satisfaction: "85%" },

            // Commerce - Government
            { name: "BSc in Business Administration", uni: "University of Sri Jayewardenepura", type: "Government", stream: "Commerce", minZ: 1.75, districts: "All", satisfaction: "94%" },
            { name: "B.Commerce", uni: "University of Kelaniya", type: "Government", stream: "Commerce", minZ: 1.55, districts: "All", satisfaction: "89%" },

            // Private Options (Alternative paths)
            { name: "BSc (Hons) in Software Engineering", uni: "SLIIT", type: "Private", stream: "Physical Science", minZ: 0.00, districts: "All", satisfaction: "94%" },
            { name: "BSc in Computer Science", uni: "NSBM Green University", type: "Private", stream: "Physical Science", minZ: 0.00, districts: "All", satisfaction: "91%" },
            { name: "BSc in Biomedical Science", uni: "KIU (Private)", type: "Private", stream: "Biological Science", minZ: 0.00, districts: "All", satisfaction: "88%" },
            { name: "BBA (Hons) in International Business", uni: "APIIT", type: "Private", stream: "Commerce", minZ: 0.00, districts: "All", satisfaction: "90%" },
            { name: "BSc in Data Science", uni: "IIT (Informatics Institute of Technology)", type: "Private", stream: "Physical Science", minZ: 0.00, districts: "All", satisfaction: "93%" },
            { name: "BA (Hons) in Psychology", uni: "The Open University (Gov/Semi)", type: "Government", stream: "Arts", minZ: 0.85, districts: "All", satisfaction: "82%" }
        ];

        function findDegrees() {
            const stream = document.getElementById('stream').value;
            const userZ = parseFloat(document.getElementById('zscore').value);
            const grid = document.getElementById('resultsGrid');
            const countLabel = document.getElementById('resultCount');

            if (isNaN(userZ)) {
                alert("Please enter a valid Z-Score to proceed.");
                return;
            }

            // Filter Logic
            const matches = degreeData.filter(d => {
                // Must match stream
                if (d.stream !== stream) return false;
                
                // For Government: Must meet min Z-Score
                if (d.type === "Government") {
                    return userZ >= d.minZ;
                }
                
                // For Private: Always show as alternatives for that stream
                return true;
            });

            // Sort: Gov Degrees first, then Private
            matches.sort((a, b) => (a.type === 'Government' ? -1 : 1));

            renderResults(matches);
            countLabel.innerText = `${matches.length} matches found`;
        }

        function renderResults(data) {
            const grid = document.getElementById('resultsGrid');
            
            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="md:col-span-2 py-20 text-center bg-white rounded-3xl border border-slate-200">
                        <h3 class="text-xl font-bold text-slate-700">No exact matches found</h3>
                        <p class="text-slate-500 mt-2">Try adjusting your Z-Score or exploring different institutions.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = data.map(d => `
                <div class="result-card bg-white p-6 rounded-2xl border border-slate-200 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${d.type === 'Government' ? 'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'}">
                                ${d.type}
                            </span>
                            <div class="flex items-center gap-1 text-amber-500 font-bold text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                                ${d.satisfaction}
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 leading-snug mb-1">${d.name}</h3>
                        <p class="text-slate-500 text-sm font-medium mb-4">${d.uni}</p>
                    </div>
                    
                    <div class="pt-4 border-t border-slate-50 flex items-center justify-between">
                        <div class="text-xs text-slate-400">
                            <span class="block uppercase font-bold">Min Z-Score</span>
                            <span class="text-slate-700 font-bold text-base">${d.type === 'Private' ? 'General Pass' : d.minZ.toFixed(4)}</span>
                        </div>
                        <button class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-blue-600 transition">
                            View Details
                        </button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
