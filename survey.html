<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Census | UniPath Lanka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-card { background: white; padding: 2rem; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); margin-bottom: 2rem; }
        .label-style { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; outline: none; transition: all 0.2s; background: #f8fafc; }
        .input-field:focus { border-color: #3b82f6; ring: 2px; ring-color: #3b82f6; }
        
        /* Custom Radio Styling */
        .radio-group-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-group-item:hover { background-color: #eff6ff; border-color: #3b82f6; }
        input[type="radio"] { width: 1.125rem; height: 1.125rem; margin-right: 0.75rem; cursor: pointer; accent-color: #2563eb; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

    <nav class="bg-white border-b border-slate-200 py-6 mb-10">
        <div class="max-w-3xl mx-auto px-6">
            <span class="text-xl font-bold text-slate-800">UniPath <span class="text-blue-600">Lanka</span></span>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6">
        <div class="mb-10">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Student Census Survey</h1>
            <p class="text-slate-500 mt-2">Help us provide better insights for future Sri Lankan students.</p>
        </div>

        <!-- Sheet Monkey Action Form Added Here -->
        <form action="https://api.sheetmonkey.io/form/fkHJQ1zsbAhvPZu6uZRffE" method="post" class="space-y-6">
            
            <!-- Hidden field for Sheet Monkey Timestamp[cite: 1] -->
            <input type="hidden" name="Created" value="x-sheetmonkey-current-date-time" />

            <!-- Section 1: Personal Information -->
            <section class="form-card">
                <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                    Personal Information
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="label-style">Name with Initials</label>
                        <input type="text" name="name_with_initials" required class="input-field" placeholder="e.g. A.B.C. Perera">
                    </div>
                    <div>
                        <label class="label-style">Age</label>
                        <input type="number" name="age" required class="input-field" placeholder="Years">
                    </div>
                    <div>
                        <label class="label-style">Gender</label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="radio-group-item">
                                <input type="radio" name="gender" value="Male" required>
                                <span class="text-sm font-medium">Male</span>
                            </label>
                            <label class="radio-group-item">
                                <input type="radio" name="gender" value="Female">
                                <span class="text-sm font-medium">Female</span>
                            </label>
                            <label class="radio-group-item">
                                <input type="radio" name="gender" value="Other">
                                <span class="text-sm font-medium">Other</span>
                            </label>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Section 2: A/L Academic Background -->
            <section class="form-card">
                <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                    A/L Academic Background
                </h2>

                <div class="space-y-6">
                    <div>
                        <label class="label-style">A/L Stream</label>
                        <select id="al_stream" name="al_stream" required class="input-field" onchange="updateSubjects()">
                            <option value="">-- Select Your Stream --</option>
                            <option value="Physical Science">Physical Science (Maths)</option>
                            <option value="Biological Science">Biological Science (Bio)</option>
                            <option value="Commerce">Commerce</option>
                            <option value="Technology">Technology</option>
                            <option value="Arts">Arts</option>
                        </select>
                    </div>

                    <div>
                        <label class="label-style">Subject Combination</label>
                        <select id="subject_combination" name="subject_combination" required disabled class="input-field" onchange="syncResultsLabels()">
                            <option value="">Select Stream First</option>
                        </select>
                    </div>

                    <!-- A/L Results Section (Dynamic) -->
                    <div id="results_display" class="hidden mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
                        <h3 class="text-sm font-bold text-blue-800 mb-4 uppercase tracking-wider">05. Enter Your Grades</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label id="sub1_label" class="block text-xs font-bold text-slate-600 mb-1 italic">Subject 01</label>
                                <select name="al_result_1" class="w-full p-2 border rounded text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500" required>
                                    <option value="">Grade</option>
                                    <option>A</option><option>B</option><option>C</option><option>S</option><option>W</option>
                                </select>
                            </div>
                            <div>
                                <label id="sub2_label" class="block text-xs font-bold text-slate-600 mb-1 italic">Subject 02</label>
                                <select name="al_result_2" class="w-full p-2 border rounded text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500" required>
                                    <option value="">Grade</option>
                                    <option>A</option><option>B</option><option>C</option><option>S</option><option>W</option>
                                </select>
                            </div>
                            <div>
                                <label id="sub3_label" class="block text-xs font-bold text-slate-600 mb-1 italic">Subject 03</label>
                                <select name="al_result_3" class="w-full p-2 border rounded text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500" required>
                                    <option value="">Grade</option>
                                    <option>A</option><option>B</option><option>C</option><option>S</option><option>W</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

           <!-- Section 3: Higher Education & Career -->
<section class="form-card">
    <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
        <span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>
        Higher Education & Career
    </h2>

    <div class="space-y-6">
        <!-- University Selection -->
        <div>
            <label class="label-style">Current University / Institution</label>
            <select name="university" required class="input-field">
                <option value="">-- Select Your Institution --</option>
                
                <optgroup label="Government Universities (UGC)">
                    <option value="Eastern University, Sri Lanka">Eastern University, Sri Lanka</option>
                    <option value="Gampaha Wickramarachchi University">Gampaha Wickramarachchi University of Indigenous Medicine</option>
                    <option value="Open University of Sri Lanka">Open University of Sri Lanka (OUSL)</option>
                    <option value="Ocean University of Sri Lanka">Ocean University of Sri Lanka (OCU)</option>
                    <option value="Rajarata University of Sri Lanka">Rajarata University of Sri Lanka</option>
                    <option value="Sabaragamuwa University of Sri Lanka">Sabaragamuwa University of Sri Lanka</option>
                    <option value="South Eastern University of Sri Lanka">South Eastern University of Sri Lanka</option>
                    <option value="University of Colombo">University of Colombo</option>
                    <option value="University of Jaffna">University of Jaffna</option>
                    <option value="University of Kelaniya">University of Kelaniya</option>
                    <option value="University of Moratuwa">University of Moratuwa</option>
                    <option value="University of Peradeniya">University of Peradeniya</option>
                    <option value="University of Ruhuna">University of Ruhuna</option>
                    <option value="University of Sri Jayewardenepura">University of Sri Jayewardenepura</option>
                    <option value="University of Vavuniya">University of Vavuniya</option>
                    <option value="University of the Visual & Performing Arts">University of the Visual & Performing Arts</option>
                    <option value="Uva Wellassa University">Uva Wellassa University</option>
                    <option value="Wayamba University of Sri Lanka">Wayamba University of Sri Lanka</option>
                    <option value="General Sir John Kotelawala Defence University">General Sir John Kotelawala Defence University (KDU)</option>
                </optgroup>

                <optgroup label="Private Universities / Degree-Awarding Institutes">
                    <option value="ANC Education">ANC Education</option>
                    <option value="APIIT">APIIT (Asia Pacific Institute of Information Technology)</option>
                    <option value="Aquinas College">Aquinas College of Higher Studies</option>
                    <option value="BMS">BMS (Business Management School)</option>
                    <option value="CINEC Campus">CINEC Campus</option>
                    <option value="ESOFT Metro Campus">ESOFT Metro Campus</option>
                    <option value="Gateway Graduate School">Gateway Graduate School</option>
                    <option value="Horizon Campus">Horizon Campus</option>
                    <option value="ICBT Campus">ICBT Campus</option>
                    <option value="IIT">IIT (Informatics Institute of Technology)</option>
                    <option value="KIU">KIU (Kaatsu International University)</option>
                    <option value="NIBM">NIBM (National Institute of Business Management)</option>
                    <option value="NSBM Green University">NSBM Green University</option>
                    <option value="RIC">RIC (Royal Institute of Colombo)</option>
                    <option value="Saegis Campus">Saegis Campus</option>
                    <option value="SANASA Campus">SANASA Campus</option>
                    <option value="SLIIT">SLIIT (Sri Lanka Institute of Information Technology)</option>
                    <option value="SLTC Research University">SLTC Research University</option>
                </optgroup>
                
                <option value="Other">Other / Professional Body (e.g. CA, CIMA, ACCA)</option>
            </select>
        </div>

        <!-- Degree Program Name -->
        <div>
            <label class="label-style">Current Degree Program Name</label>
            <input type="text" name="degree_program" required placeholder="e.g. BSc (Hons) in Software Engineering" class="input-field">
        </div>
    </div>
</section>

                    <div>
                        <label class="label-style">Satisfaction Level</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <label class="radio-group-item">
                                <input type="radio" name="satisfaction_level" value="Very Satisfied" required>
                                <span class="text-xs font-medium">Very Satisfied</span>
                            </label>
                            <label class="radio-group-item">
                                <input type="radio" name="satisfaction_level" value="Satisfied">
                                <span class="text-xs font-medium">Satisfied</span>
                            </label>
                            <label class="radio-group-item">
                                <input type="radio" name="satisfaction_level" value="Neutral">
                                <span class="text-xs font-medium">Neutral</span>
                            </label>
                            <label class="radio-group-item">
                                <input type="radio" name="satisfaction_level" value="Dissatisfied">
                                <span class="text-xs font-medium">Dissatisfied</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="label-style">Why do you feel this way? (Optional)</label>
                        <textarea name="satisfaction_comment" rows="4" class="input-field" placeholder="Share your experience with campus life or job prospects..."></textarea>
                    </div>

                    <div>
                        <label class="label-style">Future Career Aspiration</label>
                        <input type="text" name="future_career" required placeholder="e.g. Data Scientist, Teacher" class="input-field">
                    </div>
                </div>
            </section>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-lg transition duration-200">
                Submit Survey Data
            </button>
        </form>
    </main>

    <script>
        // Data Source for Sri Lankan A/L Combinations
        const alData = {
            "Physical Science": [
                { text: "Combined Maths, Physics, Chemistry", subs: ["Combined Maths", "Physics", "Chemistry"] },
                { text: "Combined Maths, Physics, ICT", subs: ["Combined Maths", "Physics", "ICT"] },
                { text: "Combined Maths, Physics, Higher Maths", subs: ["Combined Maths", "Physics", "Higher Maths"] }
            ],
            "Biological Science": [
                { text: "Biology, Chemistry, Physics", subs: ["Biology", "Chemistry", "Physics"] },
                { text: "Biology, Chemistry, Agri Science", subs: ["Biology", "Chemistry", "Agri Science"] },
                { text: "Biology, Chemistry, ICT", subs: ["Biology", "Chemistry", "ICT"] }
            ],
            "Commerce": [
                { text: "Accounting, Business Studies, Economics", subs: ["Accounting", "Business Studies", "Economics"] },
                { text: "Accounting, Business Studies, ICT", subs: ["Accounting", "Business Studies", "ICT"] }
            ],
            "Technology": [
                { text: "Engineering Tech (ET), SFT, ICT", subs: ["Engineering Tech", "SFT", "ICT"] },
                { text: "Bio Systems Tech (BST), SFT, Agri Science", subs: ["Bio Systems Tech", "SFT", "Agri Science"] }
            ],
            "Arts": [
                { text: "Economics, Political Science, Logic", subs: ["Economics", "Pol. Science", "Logic"] },
                { text: "Sinhala, History, Logic", subs: ["Sinhala", "History", "Logic"] },
                { text: "English, French, Japanese", subs: ["English", "French", "Japanese"] }
            ]
        };

        function updateSubjects() {
            const stream = document.getElementById('al_stream').value;
            const comboSelect = document.getElementById('subject_combination');
            const resultsDiv = document.getElementById('results_display');
            
            comboSelect.innerHTML = '<option value="">-- Select Combination --</option>';
            resultsDiv.classList.add('hidden');

            if (stream && alData[stream]) {
                comboSelect.disabled = false;
                alData[stream].forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.text;
                    opt.text = item.text;
                    opt.setAttribute('data-subs', JSON.stringify(item.subs));
                    comboSelect.appendChild(opt);
                });
            } else {
                comboSelect.disabled = true;
            }
        }

        function syncResultsLabels() {
            const comboSelect = document.getElementById('subject_combination');
            const resultsDiv = document.getElementById('results_display');
            const selectedOption = comboSelect.options[comboSelect.selectedIndex];

            if (comboSelect.value) {
                const subjects = JSON.parse(selectedOption.getAttribute('data-subs'));
                document.getElementById('sub1_label').innerText = subjects[0];
                document.getElementById('sub2_label').innerText = subjects[1];
                document.getElementById('sub3_label').innerText = subjects[2];
                resultsDiv.classList.remove('hidden');
            } else {
                resultsDiv.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
